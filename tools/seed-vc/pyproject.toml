[project]
name = "seed-vc"
version = "0.1.0"
description = "SeedVC voice conversion (launched from CWD; stub package for dep management)"
requires-python = ">=3.10"

dependencies = [
    "descript-audio-codec>=1.0",
    "resemblyzer",
    "funasr>=1.1",
    "munch>=4.0",
    "hydra-core>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
