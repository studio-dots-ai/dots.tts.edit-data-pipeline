defaults:
  - defaults
  - /service/asr_service/qwen3@dependencies.asr
  - /service/wer_calc/defaults@dependencies.wer
  - /service/utmos/defaults@dependencies.utmos
  - /service/spk_sim_eval/defaults@dependencies.spk_sim
  - /service/wdtw/defaults@dependencies.wdtw
  - _self_

params:
  evaluation_args: >-
    --init-evaluate-services
    --asr-url ${..dependencies.asr.url}
    --wer-url ${..dependencies.wer.url}
    --utmos-url ${..dependencies.utmos.url}
    --spk-sim-url ${..dependencies.spk_sim.url}
    --wdtw-url ${..dependencies.wdtw.url}

dependencies:
  asr:
    dependencies:
      qwen3_asr:
        gpu_ids: "1"
  utmos:
    gpu_ids: "1"
  spk_sim:
    gpu_ids: "1"
