defaults:
  - /service/defaults@_here_
  - /service/qwen3_asr/defaults@dependencies.qwen3_asr
  - _self_

config_key: asr_service/qwen3
port: 8010
health_path: /health
startup_timeout_sec: 1200
gpu_ids: ""
python_bin: envs/pipe-cpu/.venv/bin/python
params:
  default_backend: qwen3-asr
  backend_timeout: 300
  backend_startup_timeout: 1200
  buffer_batch_size: 4
  buffer_wait_ms: 200
command: >-
  ${shell_quote:${.python_bin}}
  tools/asr-service/asr_service.py
  --port ${.port}
  --default-backend ${.params.default_backend}
  --backend-url qwen3-asr=${.dependencies.qwen3_asr.url}
  --backend-timeout ${.params.backend_timeout}
  --backend-startup-timeout ${.params.backend_startup_timeout}
  --buffer-batch-size ${.params.buffer_batch_size}
  --buffer-wait-ms ${.params.buffer_wait_ms}
