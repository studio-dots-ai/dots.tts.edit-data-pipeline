defaults:
  - /service/defaults@_here_
  - /service/qwen3_tts/defaults@dependencies.qwen3_tts
  - /service/index_tts/defaults@dependencies.index_tts
  - _self_

config_key: speech_rate_conversion/defaults
port: 8004
python_bin: envs/pipe-cpu/.venv/bin/python
command: >-
  ${shell_quote:${.python_bin}}
  -m tools.speech_rate_conversion.api_service
  --port ${.port}
  --indextts-url ${.dependencies.index_tts.url}
  --qwen3tts-url ${.dependencies.qwen3_tts.url}
