[project]
name = "pipe-cpu"
version = "0.1.0"
description = "CPU-only environment for speech editing data pipeline (speech rate conversion, volume normalization, WER evaluation, pipeline orchestration)"
requires-python = ">=3.10,<3.13"

dependencies = [
    # Core scientific
    "numpy>=1.26,<2.3",
    "scipy>=1.13,<1.17",
    "librosa>=0.10.2,<0.12",
    "soundfile>=0.12,<0.14",
    "pydub>=0.25",
    "soxr>=1.0",
    "sox>=1.4",
    # Web framework (for microservices)
    "fastapi>=0.127,<1.0",
    "uvicorn>=0.38,<1.0",
    "pydantic>=2.7,<3.0",
    "requests>=2.31,<3.0",
    # WER/CER evaluation
    "jiwer>=4.0,<5.0",
    # Pipeline orchestration
    "pyarrow>=18.0",
    "tqdm>=4.65",
    "loguru>=0.7",
    # Data manipulation
    "pandas>=2.0",
    # Pitch conversion (Praat PSOLA)
    "praat-parselmouth>=0.4.5",
    # Misc
    "PyYAML>=6.0",
    "hydra-core==1.3.2",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "ipython>=8.0",
    # Testing
    "pytest>=8.0",
    "httpx>=0.27",
    "setuptools>=68,<82",
]

[tool.uv]
index-url = "https://pypi.org/simple"
